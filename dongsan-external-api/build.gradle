dependencies {
    implementation project(":dongsan-core")
    implementation project(":dongsan-core:domain-rds")
    implementation project(':dongsan-domain:domain-file')
    runtimeOnly project(':dongsan-domain:domain-rdb')
    runtimeOnly project(':dongsan-domain:domain-redis')
    testImplementation(testFixtures(project(":dongsan-core")))

    // spring boot web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // security, oauth
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.73'

    // validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    // test container
    testImplementation 'org.testcontainers:testcontainers:1.20.1'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:mysql:1.20.1'

    // test 시 patch 가능하게
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.2'
}

// application.yml 설정 파일 복사
tasks.register('copyConfig', Copy) {
    from '../Config/external-api/'
    include "application*.yml"
    into 'src/main/resources'
}

processResources.dependsOn('copyConfig')

bootJar {
    enabled = true
}

jar {
    enabled = false
}
