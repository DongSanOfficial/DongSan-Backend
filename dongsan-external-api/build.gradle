dependencies {
    implementation project(":dongsan-core:domain-rdb")
    implementation project(':dongsan-core:domain-redis')
    implementation project(':dongsan-infra:infra-file')
    testImplementation(testFixtures(project(":dongsan-core:domain-rdb")))

    // spring boot web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // security, oauth
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.73'

    // validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

    // feign (webhook용)
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.4'

    // tx
    implementation 'org.springframework:spring-tx'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // micrometer
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // test container
    testImplementation 'org.testcontainers:testcontainers:1.20.1'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:mysql:1.20.1'

    // test 시 patch 가능하게
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.2'

    // socket 모듈 이전 시 삭제
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework:spring-messaging'
}

// application.yml 설정 파일 복사
tasks.register('copyConfig', Copy) {
    from '../Config'
    include "application-api.yml", "application.yml"
    into 'src/main/resources'
}

processResources.dependsOn('copyConfig')

bootJar {
    enabled = true
}

jar {
    enabled = false
}
