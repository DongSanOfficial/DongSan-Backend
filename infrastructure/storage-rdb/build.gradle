plugins {
    id "java-test-fixtures"
//    id "maven-publish"
}

dependencies {
    compileOnly project(':core-domain')
    testImplementation project(':core-domain')

    // LineString
    implementation'org.hibernate:hibernate-spatial:6.2.2.Final'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // mysql
    runtimeOnly 'com.mysql:mysql-connector-j'

    // p6spy
    implementation "p6spy:p6spy:3.9.1"

    // List<String> <-> JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // flyway
    //implementation 'org.flywaydb:flyway-core'
    //implementation 'org.flywaydb:flyway-mysql'

    // testContainer
    testImplementation 'org.testcontainers:testcontainers:1.20.1'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:mysql:1.20.1'

    // testFixtures
    testFixturesImplementation 'org.locationtech.jts:jts-core:1.20.0'
    testFixturesCompileOnly project(':core-domain') // enum 때문에 필요
}

// application.yml 설정 파일 복사
tasks.register('copyConfig', Copy){
    from '../../Config/storage/rdb'
    include "application*.yml"
    into 'src/main/resources'
}

processResources.dependsOn('copyConfig')

bootJar {
    enabled = false
}

